[package]
name = "nrf52840_aht20_rust"
version = "0.1.0"
edition = "2021"
description = "Battery-powered BTHome v2 temperature/humidity sensor on nRF52840 + AHT20"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.10.0", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
] }

cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
# `set-vtor`: this board boots MBR -> S140 SoftDevice -> our app. The
# SoftDevice leaves VTOR pointing at its own vector table, so without this
# the app runs but every interrupt (incl. the RTC1 tick embassy-time needs)
# misvectors into the dormant SoftDevice and never reaches our handlers.
# The feature makes cortex-m-rt set VTOR to our table at 0x26000 on reset.
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }

# `panic-halt` lets the firmware build without a probe. A future nicety would
# be a panic handler that blinks an SOS on the LED, but logging a panic over
# async USB-CDC isn't reliable from panic context, so halt-on-panic stands.
panic-halt = "1.0"

# USB-CDC serial logging — the RTT/defmt replacement now that we flash over
# USB. `embassy-usb-logger` pulls in embassy-usb 0.6 (embassy-usb-driver 0.2,
# matching embassy-nrf 0.10) and routes the `log` facade out a CDC ACM port.
embassy-usb-logger = "0.6.0"
log = "0.4"

[features]
# Phase B bring-up diagnostic: VCC-rail polarity sweep, I²C address scan, and a
# raw battery-ADC readout, logged over USB-CDC. This was the Phase B default;
# Phase C promoted the sensor-driver sample loop to the default build, so the
# old diagnostic now lives behind this flag. Run with
# `cargo run --release --features bringup`.
bringup = []

# Phase B test 4: deliberately stops petting a 5 s watchdog to prove it resets
# the chip. Isolated behind a feature so the destructive reset doesn't interrupt
# the readable tests 1–3. Run with `cargo run --release --features wdt-test`;
# it resets once, confirms via RESETREAS.DOG on the next boot (no boot-loop),
# then idles. Return to the diagnostic with a plain `cargo run --release`.
wdt-test = []

# Phase B bring-up aid: replaces the diagnostic loop with a tight loop that
# hammers I²C reads at 0x38 (~6/s) so a logic analyzer always has traffic to
# capture, alternating the P0.13 rail every ~5 s. Run with
# `cargo run --release --features i2c-probe`. Temporary debug build.
i2c-probe = []

# Production builds: stable, size-optimised.
[profile.release]
debug = 2
lto = "fat"
opt-level = "z"
codegen-units = 1
overflow-checks = false
incremental = false

# Dev builds: keep optimisations on (Embassy + nrf-hal don't run usefully at opt-level 0).
[profile.dev]
debug = 2
opt-level = "s"
lto = "off"
overflow-checks = true
